<!-- LÓGICA SCRIPT INTERACTIVA -->
    <script>
        const ctxPublico = document.getElementById('graficoImpactoPublico').getContext('2d');
        new Chart(ctxPublico, {
            type: 'bar',
            data: {
                labels: ['Riesgo Multas', 'Siniestros', 'Orden (5S)'],
                datasets: [{
                    label: 'Sin Gestión',
                    data: [85, 70, 25],
                    backgroundColor: '#ef4444', 
                    borderRadius: 5
                }, {
                    label: 'Estudio Freytes',
                    data: [5, 10, 95],
                    backgroundColor: '#3b82f6', 
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { 
                        beginAtZero: true, 
                        max: 100,
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8', font: { size: 9 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#ffffff', font: { size: 10, weight: 'bold' } }
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#ffffff', font: { size: 10 } }
                    }
                }
            }
        });

        // --- GESTIÓN DE MODALES ---
        function abrirModal() {
            document.getElementById('modalDiagnostico').classList.remove('hidden');
        }
        function cerrarModal() {
            document.getElementById('modalDiagnostico').classList.add('hidden');
            document.getElementById('resultadoRiesgo').classList.add('hidden');
        }
        function abrirModalAcceso() {
            document.getElementById('modalAcceso').classList.remove('hidden');
        }
        function cerrarModalAcceso() {
            document.getElementById('modalAcceso').classList.add('hidden');
            document.getElementById('errorClave').classList.add('hidden');
            document.getElementById('claveAcceso').value = '';
        }

        // --- SIMULADOR DE RIESGO INTERACTIVO ---
        function calcularRiesgo() {
            const actividad = document.getElementById('actividad').value;
            const metros = parseFloat(document.getElementById('metros').value);
            const personal = parseInt(document.getElementById('personal').value);
            
            const resultadoDiv = document.getElementById('resultadoRiesgo');
            const valorRiesgo = document.getElementById('valorRiesgo');
            const descRiesgo = document.getElementById('descRiesgo');

            if (!metros || !personal) {
                alert('Por favor, completa la superficie y el número de trabajadores.');
                return;
            }

            resultadoDiv.classList.remove('hidden');
            
            // Lógica paramétrica de riesgo aproximado
            if (actividad === 'obra' || (actividad === 'industria' && personal > 20) || (actividad === 'agro' && metros > 1000)) {
                resultadoDiv.className = "mt-4 p-4 rounded-xl text-center border bg-red-500/10 border-red-500/30 text-red-400";
                valorRiesgo.innerText = "🚨 RIESGO ALTO / CRÍTICO";
                descRiesgo.innerText = "Tu actividad requiere por ley un Legajo Técnico obligatorio, Programas de Seguridad aprobados por la ART y mediciones periódicas físicas para mitigar la alta probabilidad de siniestros o suspensiones.";
            } else if (personal > 10 || metros > 500) {
                resultadoDiv.className = "mt-4 p-4 rounded-xl text-center border bg-yellow-500/10 border-yellow-500/30 text-yellow-400";
                valorRiesgo.innerText = "⚠️ RIESGO MEDIO";
                descRiesgo.innerText = "Cumplimiento obligatorio de Relevamiento General de Riesgos (RAGR), capacitaciones periódicas y adecuaciones de puestos. Se recomienda auditoría preventiva para evitar actas de infracción.";
            } else {
                resultadoDiv.className = "mt-4 p-4 rounded-xl text-center border bg-green-500/10 border-green-500/30 text-green-400";
                valorRiesgo.innerText = "✅ RIESGO CONTROLABLE";
                descRiesgo.innerText = "Nivel inicial. Requiere cobertura básica técnico-legal, Plan de Evacuación/Emergencias y capacitaciones esenciales en el uso de matafuegos y orden general.";
            }
        }

        // --- AUTENTICACIÓN PANEL PRIVADO (Simulado local) ---
        function verifyClave() {
            const clave = document.getElementById('claveAcceso').value;
            const errorDiv = document.getElementById('errorClave');
            
            // Reemplazar 'admin123' por la contraseña que consideres conveniente
            if (clave === 'admin123') {
                errorDiv.classList.add('hidden');
                alert('Acceso autorizado al Panel Técnico Privado.');
                cerrarModalAcceso();
                // Aquí podrías redireccionar: window.location.href = 'dashboard.html';
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        // --- ENVÍO DE CONSULTA FORMATEADA A WHATSAPP ---
        function enviarMensajeWhatsApp(event) {
            event.preventDefault(); 
            
            const nombre = document.getElementById('nombreContacto').value;
            const empresa = document.getElementById('empresaContacto').value || 'Particular/No especifica';
            const rubro = document.getElementById('rubroContacto').value;
            const mensaje = document.getElementById('mensajeContacto').value;
            
            const numeroTelefono = "543572594767";
            
            const textoMensaje = `*CONSULTA TÉCNICA - ESTUDIO FREYTES*\n\n` +
                                 `• *Contacto:* ${nombre}\n` +
                                 `• *Empresa:* ${empresa}\n` +
                                 `• *Rubro:* ${rubro}\n\n` +
                                 `*Detalle del Requerimiento:*\n${mensaje}`;
            
            const mensajeCodificado = encodeURIComponent(textoMensaje);
            const urlWhatsApp = `https://api.whatsapp.com/send?phone=${numeroTelefono}&text=${mensajeCodificado}`;
            
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
